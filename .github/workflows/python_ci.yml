name: CI Läslistan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden från repot
        uses: actions/checkout@v7

      - name: Inställningar för Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Linta koden med flake8
        run: flake8 src tests conftest.py

      - name: Kör enhetstester
        run: pytest -m unit -v

      - name: Kör integrationstester
        run: pytest -m integration -v

      - name: Kör E2E-tester med behave
        run: behave --format progress
